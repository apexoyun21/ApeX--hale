<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ApeX İhale</title>
    </head>
<body>

    <div id="yuzde-tab" class="tab-content active">
        <input type="number" id="ihaleFiyati" class="fiyat-input" placeholder="Fiyat Girin" oninput="hesaplaYuzde()">
        <div class="sonuc-kutusu">
            <div class="oran-satiri"><span class="yuzde-metin">%85:</span><div class="fiyat-grup"><span id="r85" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r85', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%84:</span><div class="fiyat-grup"><span id="r84" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r84', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%70:</span><div class="fiyat-grup"><span id="r70" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r70', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%55:</span><div class="fiyat-grup"><span id="r55" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r55', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%40:</span><div class="fiyat-grup"><span id="r40" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r40', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%30:</span><div class="fiyat-grup"><span id="r30" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r30', this)">📋</button></div></div>
            <div class="oran-satiri"><span class="yuzde-metin">%20:</span><div class="fiyat-grup"><span id="r20" class="fiyat">-</span><button class="kopyala-btn" onclick="kopyala('r20', this)">📋</button></div></div>
        </div>
        <button class="temizle-btn" onclick="temizleYuzde()">GEÇMİŞİ SİL</button>
    </div>

    <div id="dort-islem-tab" class="tab-content">
        <input type="number" id="sayi1" class="fiyat-input" placeholder="1. Sayı" oninput="otomatikHesapla()">
        <input type="number" id="sayi2" class="ek-input" placeholder="2. Sayı" oninput="otomatikHesapla()">
        
        <div class="islem-buton-grup">
            <button id="btnTopla" class="islem-btn" onclick="islemSec('+', this)">+</button>
            <button id="btnCikar" class="islem-btn" onclick="islemSec('-', this)">-</button>
            <button id="btnCarp" class="islem-btn" onclick="islemSec('*', this)">x</button>
            <button id="btnBol" class="islem-btn" onclick="islemSec('/', this)">/</button>
        </div>

        <div class="sonuc-kutusu">
            <div class="oran-satiri">
                <span class="yuzde-metin">SONUÇ:</span>
                <div class="fiyat-grup">
                    <span id="islemSonuc" class="fiyat">-</span>
                    <button class="kopyala-btn" onclick="kopyala('islemSonuc', this)">📋</button>
                </div>
            </div>
        </div>
        <button class="temizle-btn" onclick="temizleIslem()">TEMİZLE</button>
    </div>

    <textarea id="copyHelper" style="position: fixed; top: -1000px;"></textarea>

    <script>
        let aktifIslem = null;

        // --- BİLDİRİM VE SERVICE WORKER ENTEGRASYONU ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log("Service Worker Kaydedildi.");
                
                // Sayfa ilk yüklendiğinde ve SW hazır olduğunda
                navigator.serviceWorker.ready.then(registration => {
                    // Karşılama bildirimi ve zamanlayıcıyı başlatma mesajı
                    registration.active.postMessage('GIRIS_YAPILDI');
                });
            });
        }

        // Sekmeye her geri dönüldüğünde (aktif olunca) sayacı sıfırla
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage('GIRIS_YAPILDI');
            }
        });

        // Bildirim izni kontrolü
        window.addEventListener('load', () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

        // --- HESAPLAMA FONKSİYONLARI ---
        function tabAc(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-container .menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function hassasYuvarla(sayi) {
            return (Math.round(sayi * 100) / 100).toFixed(2);
        }

        function hesaplaYuzde() {
            let f = document.getElementById("ihaleFiyati").value;
            if (f > 0) {
                document.getElementById("r85").innerText = hassasYuvarla(f * 0.85);
                document.getElementById("r84").innerText = hassasYuvarla(f * 0.84);
                document.getElementById("r70").innerText = hassasYuvarla(f * 0.70);
                document.getElementById("r55").innerText = hassasYuvarla(f * 0.55);
                document.getElementById("r40").innerText = hassasYuvarla(f * 0.40);
                document.getElementById("r30").innerText = hassasYuvarla(f * 0.30);
                document.getElementById("r20").innerText = hassasYuvarla(f * 0.20);
            } else {
                temizleAlanlar();
            }
        }

        function islemSec(op, btn) {
            aktifIslem = op;
            document.querySelectorAll('.islem-btn').forEach(b => b.classList.remove('secili-islem'));
            btn.classList.add('secili-islem');
            otomatikHesapla();
        }

        function otomatikHesapla() {
            if (aktifIslem === null) return;
            let s1 = parseFloat(document.getElementById("sayi1").value);
            let s2 = parseFloat(document.getElementById("sayi2").value);
            let res = 0;
            if (isNaN(s1) || isNaN(s2)) {
                document.getElementById("islemSonuc").innerText = "-";
                return;
            }
            if (aktifIslem === '+') res = s1 + s2;
            else if (aktifIslem === '-') res = s1 - s2;
            else if (aktifIslem === '*') res = s1 * s2;
            else if (aktifIslem === '/') res = s2 === 0 ? 0 : s1 / s2;
            document.getElementById("islemSonuc").innerText = hassasYuvarla(res);
        }

        function kopyala(id, element) {
            let metin = document.getElementById(id).innerText;
            if (metin === "-") return;
            const helper = document.getElementById("copyHelper");
            helper.value = metin;
            helper.select();
            document.execCommand("copy");
            element.classList.add("basari-efekti");
            setTimeout(() => element.classList.remove("basari-efekti"), 300);
        }

        function temizleYuzde() {
            document.getElementById("ihaleFiyati").value = "";
            temizleAlanlar();
        }

        function temizleAlanlar() {
            ["r85", "r84", "r70", "r55", "r40", "r30", "r20"].forEach(id => document.getElementById(id).innerText = "-");
        }

        function temizleIslem() {
            document.getElementById("sayi1").value = "";
            document.getElementById("sayi2").value = "";
            document.getElementById("islemSonuc").innerText = "-";
            aktifIslem = null;
            document.querySelectorAll('.islem-btn').forEach(b => b.classList.remove('secili-islem'));
        }
    </script>
</body>
          </html>
