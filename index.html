<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ApeX Pro v4.1 - Birhat Yüzkan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #010409;
            --panel: #0d1117;
            --accent: #00d2ff; 
            --accent-glow: rgba(0, 210, 255, 0.2);
            --line: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #8b949e;
        }

        /* Takım Temaları */
        [data-theme="fb"] { --accent: #FFD700; --accent-glow: rgba(255, 215, 0, 0.4); --bg: #001d3d; }
        [data-theme="gs"] { --accent: #FFD700; --accent-glow: rgba(255, 215, 0, 0.4); --bg: #2d0000; }
        [data-theme="bjk"] { --accent: #ffffff; --accent-glow: rgba(255, 255, 255, 0.2); --bg: #000000; }
        [data-theme="ts"] { --accent: #6ecff6; --accent-glow: rgba(110, 207, 246, 0.3); --bg: #4a0014; }
        
        [data-theme="red"] { --accent: #ff3131; --accent-glow: rgba(255, 49, 49, 0.2); }
        [data-theme="green"] { --accent: #008f39; --accent-glow: rgba(0, 143, 57, 0.2); }
        [data-theme="yellow"] { --accent: #fff01f; --accent-glow: rgba(255, 240, 31, 0.2); }
        [data-theme="blue"] { --accent: #00d2ff; --accent-glow: rgba(0, 210, 255, 0.2); }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: all 0.25s ease; }
        body { margin: 0; padding: 15px 0 120px; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        #loader {
            position: fixed; inset: 0; z-index: 9999; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; transition: opacity 0.3s;
        }
        body.loaded #loader { opacity: 0; visibility: hidden; }
        .loader-logo { color: var(--accent); font-size: 26px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px var(--accent-glow); }

        .container { width: calc(100% - 30px); max-width: 420px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        
        .pinnacle-logo { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .pinnacle-svg { width: 100%; height: 100%; fill: none; stroke: var(--accent); stroke-width: 2.8; filter: drop-shadow(0 0 5px var(--accent-glow)); }
        .apex-text { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }

        .top-settings-btn {
            width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
            display: grid; place-items: center; color: var(--muted); cursor: pointer;
            background: rgba(255,255,255,0.02); font-size: 18px;
        }
        .top-settings-btn.active { color: var(--accent); border-color: var(--accent); }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
        .label { color: var(--muted); font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 1px; }

        input {
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid var(--line);
            border-radius: 15px; color: var(--accent); font-size: 28px;
            text-align: right; padding: 12px; outline: none; font-weight: bold;
        }

        .rate-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .rate-row.hidden { display: none; }
        .rate-val { color: var(--accent); font-size: 19px; font-weight: 800; }
        
        .copy-btn { background: transparent; border: 1px solid var(--line); color: var(--accent); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; }

        .op-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .op-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: #fff; padding: 15px 0; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .op-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .op-btn.hidden { display: none; }

        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .color-dot { height: 40px; border-radius: 10px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); overflow: hidden; position: relative; }
        .split { position: absolute; inset: 0; display: flex; }
        .split span { flex: 1; height: 100%; }

        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #21262d; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* GÜNCELLENEN NAV STİLİ */
        nav {
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 30px); 
            max-width: 400px;
            background: rgba(13, 17, 23, 0.98); 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            padding: 8px; 
            border-radius: 25px; 
            border: 1px solid var(--line);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Klavye açıldığında menüyü gizlemek için class */
        .nav-hidden {
            display: none !important;
        }

        .nav-item { background: transparent; border: none; color: var(--muted); font-weight: 800; padding: 15px; cursor: pointer; border-radius: 18px; }
        .nav-item.active { background: rgba(255,255,255,0.05); color: var(--accent); }

        .btn-clear { width: 100%; padding: 15px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 11px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="pinnacle-logo" style="width: 80px; height: 80px;">
        <svg class="pinnacle-svg" viewBox="0 0 100 100">
            <path d="M50 15 L85 85 L50 70 L15 85 Z M50 15 L50 70" />
        </svg>
    </div>
    <div class="loader-logo">ApeX-v4.1</div>
</div>

<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:14px;">
            <div class="pinnacle-logo">
                <svg class="pinnacle-svg" viewBox="0 0 100 100">
                    <path d="M50 15 L85 85 L50 70 L15 85 Z M50 15 L50 70" />
                </svg>
            </div>
            <div>
                <div class="apex-text">ApeX Pro</div>
                <small style="color:var(--accent); font-weight: bold; letter-spacing: 0.5px;">Birhat Yüzkan v4.1</small>
            </div>
        </div>
        <div class="top-settings-btn" id="settings-btn" onclick="showSettings()">
            <i class="fa-solid fa-sliders"></i>
        </div>
    </header>

    <div id="tab-yuzde" class="tab-content">
        <div class="card">
            <span class="label">İhale Fiyatı</span>
            <input type="number" id="fiyatInp" inputmode="decimal" placeholder="0,000" oninput="hesapla()">
        </div>
        <div class="card" id="yuzdeListesi"></div>
        <button class="btn-clear" onclick="resetYuzde()">SIFIRLA</button>
    </div>

    <div id="tab-islem" class="tab-content" style="display:none;">
        <div class="op-grid">
            <button class="op-btn active" id="btn-topla" onclick="setOp('TOPLAMA', this)">TOPLAMA</button>
            <button class="op-btn" id="btn-cikar" onclick="setOp('ÇIKARMA', this)">ÇIKARMA</button>
            <button class="op-btn" id="btn-carp" onclick="setOp('ÇARPMA', this)">ÇARPMA</button>
            <button class="op-btn" id="btn-bol" onclick="setOp('BÖLME', this)">BÖLME</button>
        </div>
        <div class="card">
            <span class="label">Değer 1</span>
            <input type="number" id="s1" inputmode="decimal" placeholder="0" oninput="doMath()">
            <div class="divider" style="height: 1px; background: var(--line); margin: 15px 0;"></div>
            <span class="label">Değer 2</span>
            <input type="number" id="s2" inputmode="decimal" placeholder="0" oninput="doMath()">
        </div>
        <div class="card">
            <span class="label">Sonuç</span>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="mathResult" style="font-size:32px; font-weight:800; color:var(--accent);">0,000</span>
                <button class="copy-btn" onclick="kopyala('mathResult')"><i class="fa-regular fa-copy"></i></button>
            </div>
        </div>
    </div>

    <div id="tab-ayarlar" class="tab-content" style="display:none;">
        <div class="card">
            <span class="label">Standart Renkler</span>
            <div class="color-grid">
                <div class="color-dot" style="background:#00d2ff;" onclick="setTheme('blue')"></div>
                <div class="color-dot" style="background:#ff3131;" onclick="setTheme('red')"></div>
                <div class="color-dot" style="background:#008f39;" onclick="setTheme('green')"></div>
                <div class="color-dot" style="background:#fff01f;" onclick="setTheme('yellow')"></div>
            </div>
            
            <span class="label">Takım Renkleri</span>
            <div class="color-grid">
                <div class="color-dot" onclick="setTheme('fb')"><div class="split"><span style="background:#FFD700"></span><span style="background:#001d3d"></span></div></div>
                <div class="color-dot" onclick="setTheme('gs')"><div class="split"><span style="background:#ff0000"></span><span style="background:#FFD700"></span></div></div>
                <div class="color-dot" onclick="setTheme('bjk')"><div class="split"><span style="background:#000000"></span><span style="background:#ffffff"></span></div></div>
                <div class="color-dot" onclick="setTheme('ts')"><div class="split"><span style="background:#800000"></span><span style="background:#6ecff6"></span></div></div>
            </div>

            <span class="label">İşlemleri Yönet</span>
            <div class="setting-item"><span>Toplama</span><label class="switch"><input type="checkbox" checked id="sw-topla" onchange="toggleOp('topla', this.checked)"><span class="slider"></span></label></div>
            <div class="setting-item"><span>Çıkarma</span><label class="switch"><input type="checkbox" checked id="sw-cikar" onchange="toggleOp('cikar', this.checked)"><span class="slider"></span></label></div>
            <div class="setting-item"><span>Çarpma</span><label class="switch"><input type="checkbox" checked id="sw-carp" onchange="toggleOp('carp', this.checked)"><span class="slider"></span></label></div>
            <div class="setting-item"><span>Bölme</span><label class="switch"><input type="checkbox" checked id="sw-bol" onchange="toggleOp('bol', this.checked)"><span class="slider"></span></label></div>
        </div>
        <div class="card">
            <span class="label">Görünür Oranlar</span>
            <div id="switchListesi"></div>
        </div>
        <button class="btn-clear" onclick="closeSettings()">KAYDET VE ÇIK</button>
    </div>
</div>

<nav id="bottom-nav">
    <button class="nav-item active" id="nav-yuzde" onclick="showTab('tab-yuzde', this)">Yüzdelik</button>
    <button class="nav-item" id="nav-islem" onclick="showTab('tab-islem', this)">4 İşlem</button>
</nav>

<textarea id="copyHelper" style="position:absolute; left:-999px;"></textarea>

<script>
    const oranlar = [85, 84, 70, 69, 55, 54, 40, 39, 30, 20];
    let currentOp = 'TOPLAMA';

    // KLAVYE KONTROLÜ: Klavye açıldığında menüyü gizler
    const initialHeight = window.innerHeight;
    window.addEventListener('resize', () => {
        const nav = document.getElementById('bottom-nav');
        if (window.innerHeight < initialHeight * 0.8) {
            nav.classList.add('nav-hidden');
        } else {
            nav.classList.remove('nav-hidden');
        }
    });

    window.onload = () => {
        const savedTheme = localStorage.getItem('apexTheme') || 'blue';
        setTheme(savedTheme);

        const yList = document.getElementById('yuzdeListesi');
        const sList = document.getElementById('switchListesi');
        
        oranlar.forEach(o => {
            const isVisible = localStorage.getItem('rate-'+o) !== 'false';
            yList.innerHTML += `<div class="rate-row ${isVisible ? '' : 'hidden'}" id="row-${o}"><span>%${o}</span><span class="rate-val" id="r${o}">0,000</span><button class="copy-btn" onclick="kopyala('r${o}')"><i class="fa-regular fa-copy"></i></button></div>`;
            sList.innerHTML += `<div class="setting-item"><span>%${o} Göster</span><label class="switch"><input type="checkbox" ${isVisible ? 'checked' : ''} onchange="toggleRate(${o}, this.checked)"><span class="slider"></span></label></div>`;
        });

        ['topla','cikar','carp','bol'].forEach(op => {
            const isVisible = localStorage.getItem('op-'+op) !== 'false';
            document.getElementById('btn-'+op).classList.toggle('hidden', !isVisible);
            document.getElementById('sw-'+op).checked = isVisible;
        });

        setTimeout(() => document.body.classList.add('loaded'), 700);
    };

    function setTheme(t) { 
        document.body.setAttribute('data-theme', t); 
        localStorage.setItem('apexTheme', t);
        doMath(); 
    }

    function toggleRate(o, isVisible) { 
        document.getElementById(`row-${o}`).classList.toggle('hidden', !isVisible); 
        localStorage.setItem('rate-'+o, isVisible);
    }

    function toggleOp(op, isVisible) { 
        document.getElementById(`btn-${op}`).classList.toggle('hidden', !isVisible); 
        localStorage.setItem('op-'+op, isVisible);
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('settings-btn').classList.remove('active');
        document.getElementById(id).style.display = 'block';
        if(btn) btn.classList.add('active');
    }

    function showSettings() {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-ayarlar').style.display = 'block';
        document.getElementById('settings-btn').classList.add('active');
    }

    function closeSettings() { showTab('tab-yuzde', document.getElementById('nav-yuzde')); }

    function format(n) {
        const temizSayi = Number(n.toFixed(3));
        return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(temizSayi);
    }

    function hesapla() {
        const val = parseFloat(document.getElementById('fiyatInp').value) || 0;
        oranlar.forEach(o => { document.getElementById('r'+o).innerText = format((val * o) / 100); });
    }

    function setOp(op, btn) {
        currentOp = op;
        document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        doMath();
    }

    function doMath() {
        const v1 = parseFloat(document.getElementById('s1').value) || 0;
        const v2 = parseFloat(document.getElementById('s2').value) || 0;
        let res = 0;
        if(currentOp === 'TOPLAMA') res = v1 + v2;
        else if(currentOp === 'ÇIKARMA') res = v1 - v2;
        else if(currentOp === 'ÇARPMA') res = v1 * v2;
        else if(currentOp === 'BÖLME') res = v2 !== 0 ? v1 / v2 : 0;
        document.getElementById('mathResult').innerText = format(res);
    }

    function kopyala(id) {
        const helper = document.getElementById("copyHelper");
        helper.value = document.getElementById(id).innerText.replace(/\./g, "").replace(",", ".");
        helper.select();
        document.execCommand("copy");
    }

    function resetYuzde() { document.getElementById('fiyatInp').value = ''; hesapla(); }
</script>
</body>
                                                                                                                                                                                                                </html>
