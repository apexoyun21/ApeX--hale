<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApeX İhale Hesaplayıcısı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            margin: 0;
        }
        #baslangic-butonu {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff9800;
            color: #121212;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #baslangic-butonu:hover {
            background-color: #e68900;
            transform: scale(1.05);
        }
        #resim-alani {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }
        #resim-alani img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <button id="baslangic-butonu" onclick="ihaleEkraniniAc()">ApeX İhale Hesaplayıcısına Git</button>

    <div id="resim-alani">
        <img id="ihale-resmi" src="https://nolur.com/nah.png" alt="ApeX İhale">
    </div>

    <script>
        function ihaleEkraniniAc() {
            document.getElementById('baslangic-butonu').style.display = 'none';
            document.getElementById('resim-alani').style.display = 'block';
        }
    </script>

</body>
</html>
