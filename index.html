<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApeX Pro Hesap Botu</title>
    <style>
        :root {
            --apex-gold: #FFD700;
            --apex-red: #FF0000;
            --apex-green: #008000;
            --apex-line: #00FF00;
            --apex-black: #000000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--apex-black);
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- SADELEŞTİRİLMİŞ AÇILIŞ EKRANI (0.7 SN) --- */
        #apex-loader {
            position: fixed;
            inset: 0;
            background: var(--apex-black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .apex-logo {
            text-align: center;
            color: var(--apex-gold);
            animation: fadeIn 0.5s ease-out;
        }

        .apex-logo h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 0 0 25px var(--apex-gold);
            letter-spacing: 3px;
            font-weight: 900;
        }

        .apex-logo p {
            font-size: 26px;
            margin: 10px 0 0;
            text-shadow: 0 0 15px var(--apex-gold);
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.loaded #apex-loader {
            opacity: 0;
            pointer-events: none;
        }

        /* --- ANA UYGULAMA ARAYÜZÜ --- */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .menu-container { display: flex; gap: 10px; }
        .menu-btn {
            flex: 1; padding: 14px; border-radius: 18px; font-weight: bold; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; border: 2.5px solid var(--apex-gold);
        }
        .menu-btn.active { background-color: var(--apex-gold); color: black; }
        .menu-btn:not(.active) { background-color: transparent; color: var(--apex-gold); }

        /* GİRİŞ ALANLARI */
        .fiyat-input {
            width: 100%; padding: 22px; border-radius: 45px; font-size: 2.4rem; text-align: center;
            color: white; font-weight: bold; border: 4px solid var(--apex-gold);
            box-sizing: border-box; outline: none;
        }
        .bg-red { background-color: var(--apex-red); }
        .bg-dark { background-color: #1a1a1a; }

        /* İŞLEM BUTONLARI */
        .islem-buton-grup { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .islem-btn {
            padding: 18px; border-radius: 15px; font-size: 1.6rem; font-weight: bold;
            background-color: #222; color: var(--apex-gold); border: 2px solid var(--apex-gold); cursor: pointer;
        }
        .secili-islem { background-color: var(--apex-line) !important; color: white !important; border-color: white !important; }

        /* SONUÇ KUTUSU */
        .sonuc-kutusu {
            background-color: var(--apex-green);
            border-radius: 35px;
            border: 4px solid var(--apex-red);
            padding: 18px;
            box-sizing: border-box;
        }

        .oran-satiri {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 5px;
            position: relative;
        }

        .oran-satiri:not(:last-child)::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--apex-line);
        }

        .fiyat { font-weight: 800; font-size: 1.3rem; }

        .kopyala-btn {
            background-color: transparent;
            border: 2px solid var(--apex-line);
            color: white;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 12px;
        }

        .temizle-btn {
            width: 100%; padding: 20px; background-color: var(--apex-gold);
            color: black; border: none; border-radius: 40px; font-weight: 900;
            font-size: 1.2rem; text-transform: uppercase; cursor: pointer;
            margin-top: 10px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: tabFade 0.4s ease; }
        @keyframes tabFade { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="apex-loader">
        <div class="apex-logo">
            <h1>ApeX Pro</h1>
            <p>Hesap Botu</p>
        </div>
    </div>

    <div class="container">
        <div class="menu-container">
            <button class="menu-btn active" onclick="tabAc('yuzde-tab', this)">% YÜZDE</button>
            <button class="menu-btn" onclick="tabAc('islem-tab', this)">DÖRT İŞLEM</button>
        </div>

        <div id="yuzde-tab" class="tab-content active">
            <input type="number" id="ihaleFiyati" class="fiyat-input bg-red" placeholder="0" inputmode="decimal" oninput="hesaplaYuzde()">
            <div class="sonuc-kutusu" style="margin-top: 15px;">
                <div class="oran-satiri"><span>%85:</span><div><span id="r85" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r85')">✓</button></div></div>
                <div class="oran-satiri"><span>%84:</span><div><span id="r84" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r84')">✓</button></div></div>
                <div class="oran-satiri"><span>%70:</span><div><span id="r70" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r70')">✓</button></div></div>
                <div class="oran-satiri"><span>%55:</span><div><span id="r55" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r55')">✓</button></div></div>
                <div class="oran-satiri"><span>%40:</span><div><span id="r40" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r40')">✓</button></div></div>
                <div class="oran-satiri"><span>%30:</span><div><span id="r30" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r30')">✓</button></div></div>
                <div class="oran-satiri"><span>%20:</span><div><span id="r20" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('r20')">✓</button></div></div>
            </div>
            <button class="temizle-btn" onclick="temizleYuzde()">% GEÇMİŞİ SİL</button>
        </div>

        <div id="islem-tab" class="tab-content">
            <input type="number" id="sayi1" class="fiyat-input bg-red" placeholder="1. Sayı" inputmode="decimal" oninput="hesaplaIslem()">
            <input type="number" id="sayi2" class="fiyat-input bg-dark" placeholder="2. Sayı" inputmode="decimal" oninput="hesaplaIslem()" style="margin-top: 10px;">
            
            <div class="islem-buton-grup" style="margin-top: 15px;">
                <button class="islem-btn" onclick="islemSec('+', this)">+</button>
                <button class="islem-btn" onclick="islemSec('-', this)">-</button>
                <button class="islem-btn" onclick="islemSec('*', this)">x</button>
                <button class="islem-btn" onclick="islemSec('/', this)">/</button>
            </div>

            <div class="sonuc-kutusu" style="margin-top: 15px;">
                <div class="oran-satiri">
                    <span>SONUÇ:</span>
                    <div><span id="islemSonuc" class="fiyat">0.00</span><button class="kopyala-btn" onclick="kopyala('islemSonuc')">📋</button></div>
                </div>
            </div>
            <button class="temizle-btn" onclick="temizleIslem()">TEMİZLE</button>
        </div>
    </div>

    <textarea id="copyHelper" style="position:absolute; left:-9999px;"></textarea>

    <script>
        let aktifOp = null;

        // 0.7 Saniye sonra Açılış Kapanır
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.body.classList.add("loaded");
            }, 700);
        });

        function tabAc(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        const formatla = (num) => new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);

        function hesaplaYuzde() {
            const val = parseFloat(document.getElementById('ihaleFiyati').value);
            if (isNaN(val)) return;
            const oranlar = [85, 84, 70, 55, 40, 30, 20];
            oranlar.forEach(o => {
                document.getElementById(`r${o}`).innerText = formatla((val * o) / 100);
            });
        }

        function islemSec(op, btn) {
            aktifOp = op;
            document.querySelectorAll('.islem-btn').forEach(b => b.classList.remove('secili-islem'));
            btn.classList.add('secili-islem');
            hesaplaIslem();
        }

        function hesaplaIslem() {
            const s1 = parseFloat(document.getElementById('sayi1').value);
            const s2 = parseFloat(document.getElementById('sayi2').value);
            if (isNaN(s1) || isNaN(s2) || !aktifOp) return;
            
            let res = 0;
            switch(aktifOp) {
                case '+': res = s1 + s2; break;
                case '-': res = s1 - s2; break;
                case '*': res = s1 * s2; break;
                case '/': res = s2 !== 0 ? s1 / s2 : 0; break;
            }
            document.getElementById('islemSonuc').innerText = formatla(res);
        }

        function kopyala(id) {
            const span = document.getElementById(id);
            const text = span.innerText.replace(/\./g, '').replace(',', '.');
            const helper = document.getElementById('copyHelper');
            helper.value = text;
            helper.select();
            document.execCommand('copy');
            
            const btn = span.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "✅";
            setTimeout(() => btn.innerText = originalText, 1000);
        }

        function temizleYuzde() {
            document.getElementById('ihaleFiyati').value = "";
            document.querySelectorAll('#yuzde-tab .fiyat').forEach(f => f.innerText = "0.00");
        }

        function temizleIslem() {
            document.getElementById('sayi1').value = "";
            document.getElementById('sayi2').value = "";
            document.getElementById('islemSonuc').innerText = "0.00";
            aktifOp = null;
            document.querySelectorAll('.islem-btn').forEach(b => b.classList.remove('secili-islem'));
        }
    </script>
</body>
</html>
