<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApeX İhale Yardım</title>
    <style>
        :root {
            --bg: #050607;
            --panel: #101316;
            --panel-soft: #171b1f;
            --line: rgba(255, 255, 255, 0.1);
            --text: #f5f7f8;
            --muted: #9ca5aa;
            --accent: #78d8bb;
            --accent-strong: #50c49e;
            --danger: #ff5f5f;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 18px 0 96px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% -10%, rgba(120, 216, 187, 0.16), transparent 34%),
                linear-gradient(180deg, #0c0f11 0%, var(--bg) 48%, #020303 100%);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #apex-loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: #030404;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        body.loaded #apex-loader {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            text-align: center;
            color: var(--accent);
        }

        .loader-logo h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 2px;
        }

        .loader-logo p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 17px;
        }

        .app {
            width: calc(100vw - 28px);
            max-width: 400px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent);
        }

        .brand h1 {
            margin: 0;
            font-size: 19px;
            line-height: 1.1;
        }

        .brand span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-pill {
            padding: 8px 10px;
            border: 1px solid rgba(120, 216, 187, 0.25);
            border-radius: 999px;
            color: var(--accent);
            background: rgba(120, 216, 187, 0.08);
            font-size: 12px;
            font-weight: 700;
        }

        .screen {
            display: none;
            animation: fadeIn 0.22s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-panel,
        .result-panel,
        .operation-panel {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035));
            box-shadow: var(--shadow);
        }

        .hero-panel {
            padding: 16px;
            margin-bottom: 14px;
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .main-input {
            width: 100%;
            min-height: 78px;
            border: 1px solid rgba(120, 216, 187, 0.38);
            border-radius: 16px;
            outline: none;
            background: rgba(0, 0, 0, 0.28);
            color: var(--text);
            font-size: 36px;
            font-weight: 800;
            text-align: center;
        }

        .main-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .result-panel {
            overflow: hidden;
            margin-bottom: 14px;
        }

        .rate-row {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) 34px;
            column-gap: 8px;
            align-items: center;
            min-height: 58px;
            padding: 0 14px;
            border-bottom: 1px solid var(--line);
        }

        .rate-row:last-child {
            border-bottom: 0;
        }

        .rate-name {
            color: var(--accent);
            font-weight: 900;
        }

        .value {
            justify-self: end;
            font-size: 22px;
            font-weight: 850;
            letter-spacing: 0.02em;
        }

        .copy-btn,
        .clear-btn,
        .nav-btn,
        .operation-card {
            cursor: pointer;
            font: inherit;
        }

        .copy-btn {
            width: 34px;
            height: 34px;
            margin-left: 0;
            border: 1px solid rgba(120, 216, 187, 0.42);
            border-radius: 10px;
            background: rgba(120, 216, 187, 0.08);
            color: var(--accent);
        }

        .clear-btn {
            width: 100%;
            min-height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.055);
            color: var(--text);
            font-weight: 850;
        }

        .operation-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .operation-card {
            min-height: 104px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.045);
            color: var(--text);
            text-align: left;
            padding: 14px;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }

        .operation-card.active {
            border-color: rgba(120, 216, 187, 0.75);
            background: rgba(120, 216, 187, 0.12);
        }

        .operation-card:active {
            transform: scale(0.98);
        }

        .operation-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            margin-bottom: 12px;
            border-radius: 10px;
            color: var(--accent);
            background: rgba(120, 216, 187, 0.09);
            font-size: 24px;
            font-weight: 900;
        }

        .operation-title {
            display: block;
            font-size: 16px;
            font-weight: 850;
        }

        .operation-hint {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .input-stack {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
        }

        .operation-panel {
            padding: 16px;
            margin-bottom: 14px;
        }

        .operation-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 66px;
            padding: 0 14px;
            border: 1px solid rgba(120, 216, 187, 0.35);
            border-radius: 16px;
            background: rgba(120, 216, 187, 0.08);
        }

        .operation-result small {
            display: block;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .operation-result .value {
            font-size: 25px;
        }

        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 14px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: min(calc(100% - 24px), 400px);
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background: rgba(5, 6, 7, 0.86);
            backdrop-filter: blur(14px);
            transform: translateX(-50%);
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.45);
        }

        .nav-btn {
            min-height: 62px;
            border: 0;
            border-radius: 13px;
            background: transparent;
            color: var(--muted);
            font-weight: 850;
        }

        .nav-btn.active {
            color: var(--accent);
            background: rgba(120, 216, 187, 0.1);
        }

        .nav-btn svg,
        .brand-mark svg {
            width: 25px;
            height: 25px;
            display: block;
            margin: 0 auto 5px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-mark svg {
            margin: 0;
        }

        .nav-btn span {
            display: block;
            font-size: 12px;
        }

        @media (max-width: 360px) {
            body {
                padding-inline: 10px;
            }

            .main-input {
                font-size: 31px;
            }

            .value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="apex-loader">
        <div class="loader-logo">
            <h1>ApeX</h1>
            <p>İhale Yardım</p>
        </div>
    </div>

    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 20 12 4l8 16-8-4-8 4Z"></path><path d="m12 4 0 12"></path></svg>
                </div>
                <div>
                    <h1>ApeX İhale</h1>
                    <span>Parapania teklif yardımcısı</span>
                </div>
            </div>
            <div class="status-pill">Canlı</div>
        </header>

        <section id="yuzde-tab" class="screen active">
            <div class="hero-panel">
                <div class="section-label">
                    <span>İhale fiyatı</span>
                    <span>Yüzdelik</span>
                </div>
                <input type="number" id="ihaleFiyati" class="main-input" placeholder="0" inputmode="decimal" oninput="hesaplaYuzde()">
            </div>

            <div class="result-panel">
                <div class="rate-row"><span class="rate-name">%85</span><span id="r85" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r85')" aria-label="%85 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%84</span><span id="r84" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r84')" aria-label="%84 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%70</span><span id="r70" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r70')" aria-label="%70 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%55</span><span id="r55" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r55')" aria-label="%55 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%40</span><span id="r40" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r40')" aria-label="%40 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%30</span><span id="r30" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r30')" aria-label="%30 kopyala">⧉</button></div>
                <div class="rate-row"><span class="rate-name">%20</span><span id="r20" class="value">0,00</span><button class="copy-btn" onclick="kopyala('r20')" aria-label="%20 kopyala">⧉</button></div>
            </div>

            <button class="clear-btn" onclick="temizleYuzde()">Yüzde ekranını temizle</button>
        </section>

        <section id="islem-tab" class="screen">
            <div class="operation-grid">
                <button class="operation-card active" onclick="islemSec('+', this)">
                    <span class="operation-icon">+</span>
                    <span class="operation-title">Toplama</span>
                    <span class="operation-hint">İki sayıyı birleştir</span>
                </button>
                <button class="operation-card" onclick="islemSec('-', this)">
                    <span class="operation-icon">−</span>
                    <span class="operation-title">Çıkarma</span>
                    <span class="operation-hint">Farkı hesapla</span>
                </button>
                <button class="operation-card" onclick="islemSec('*', this)">
                    <span class="operation-icon">×</span>
                    <span class="operation-title">Çarpma</span>
                    <span class="operation-hint">Katlı sonucu bul</span>
                </button>
                <button class="operation-card" onclick="islemSec('/', this)">
                    <span class="operation-icon">÷</span>
                    <span class="operation-title">Bölme</span>
                    <span class="operation-hint">Oranı hesapla</span>
                </button>
            </div>

            <div class="operation-panel">
                <div class="section-label">
                    <span id="islemBaslik">Toplama işlemi</span>
                    <span>Otomatik</span>
                </div>
                <div class="input-stack">
                    <input type="number" id="sayi1" class="main-input" placeholder="1. sayı" inputmode="decimal" oninput="hesaplaIslem()">
                    <input type="number" id="sayi2" class="main-input" placeholder="2. sayı" inputmode="decimal" oninput="hesaplaIslem()">
                </div>
                <div class="operation-result">
                    <div>
                        <small>Sonuç</small>
                        <span id="islemSonuc" class="value">0,00</span>
                    </div>
                    <button class="copy-btn" onclick="kopyala('islemSonuc')" aria-label="Sonucu kopyala">⧉</button>
                </div>
            </div>

            <button class="clear-btn" onclick="temizleIslem()">İşlem ekranını temizle</button>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Ana menü">
        <button class="nav-btn active" data-tab="yuzde-tab" onclick="tabAc('yuzde-tab', this)">
            <svg viewBox="0 0 24 24"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="7" cy="7" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>
            <span>Yüzdelik</span>
        </button>
        <button class="nav-btn" data-tab="islem-tab" onclick="tabAc('islem-tab', this)">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path><path d="M17 7l-2 2"></path><path d="M17 17l-2-2"></path></svg>
            <span>4 İşlem</span>
        </button>
    </nav>

    <textarea id="copyHelper" style="position:absolute; left:-9999px;"></textarea>

    <script>
        let aktifOp = "+";

        const islemAdlari = {
            "+": "Toplama işlemi",
            "-": "Çıkarma işlemi",
            "*": "Çarpma işlemi",
            "/": "Bölme işlemi"
        };

        window.addEventListener("load", () => {
            const initialTab = location.hash === "#islem" ? "islem-tab" : "yuzde-tab";
            const initialBtn = document.querySelector(`[data-tab="${initialTab}"]`);

            if (initialBtn) {
                tabAc(initialTab, initialBtn);
            }

            setTimeout(() => {
                document.body.classList.add("loaded");
            }, 500);
        });

        function tabAc(id, btn) {
            document.querySelectorAll(".screen").forEach(tab => tab.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(nav => nav.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            btn.classList.add("active");
        }

        function temizSayi(value) {
            return parseFloat(String(value).replace(",", "."));
        }

        function formatla(num) {
            return new Intl.NumberFormat("tr-TR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }

        function hesaplaYuzde() {
            const val = temizSayi(document.getElementById("ihaleFiyati").value);
            const oranlar = [85, 84, 70, 55, 40, 30, 20];

            oranlar.forEach(oran => {
                const sonuc = Number.isNaN(val) ? 0 : (val * oran) / 100;
                document.getElementById(`r${oran}`).innerText = formatla(sonuc);
            });
        }

        function islemSec(op, btn) {
            aktifOp = op;
            document.querySelectorAll(".operation-card").forEach(card => card.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById("islemBaslik").innerText = islemAdlari[op];
            hesaplaIslem();
        }

        function hesaplaIslem() {
            const s1 = temizSayi(document.getElementById("sayi1").value);
            const s2 = temizSayi(document.getElementById("sayi2").value);

            if (Number.isNaN(s1) || Number.isNaN(s2)) {
                document.getElementById("islemSonuc").innerText = "0,00";
                return;
            }

            let sonuc = 0;

            if (aktifOp === "+") sonuc = s1 + s2;
            if (aktifOp === "-") sonuc = s1 - s2;
            if (aktifOp === "*") sonuc = s1 * s2;
            if (aktifOp === "/") sonuc = s2 === 0 ? 0 : s1 / s2;

            document.getElementById("islemSonuc").innerText = formatla(sonuc);
        }

        function kopyala(id) {
            const span = document.getElementById(id);
            const helper = document.getElementById("copyHelper");
            const text = span.innerText.replace(/\./g, "").replace(",", ".");
            const btn = span.closest(".rate-row, .operation-result").querySelector(".copy-btn");
            const oldText = btn.innerText;

            helper.value = text;
            helper.select();
            document.execCommand("copy");

            btn.innerText = "✓";
            setTimeout(() => {
                btn.innerText = oldText;
            }, 900);
        }

        function temizleYuzde() {
            document.getElementById("ihaleFiyati").value = "";
            document.querySelectorAll("#yuzde-tab .value").forEach(item => {
                item.innerText = "0,00";
            });
        }

        function temizleIslem() {
            document.getElementById("sayi1").value = "";
            document.getElementById("sayi2").value = "";
            document.getElementById("islemSonuc").innerText = "0,00";
        }
    </script>
</body>
</html>
